app:
  id: ari:cloud:ecosystem::app/e2e-customui-bridge
  runtime:
    name: nodejs22.x

modules:
  jira:issuePanel:
    - key: test-panel
      title: Bridge Test
      icon: https://example.com/icon.svg
      resource: static-ui
      resolver:
        function: resolver

  function:
    - key: resolver
      handler: resolvers.handler

resources:
  - key: static-ui
    path: static

permissions:
  scopes:
    - read:jira-work
    - read:confluence-space.summary
