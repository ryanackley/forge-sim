app:
  id: ari:cloud:ecosystem::app/e2e-uikit-bridge
  runtime:
    name: nodejs22.x

modules:
  jira:issuePanel:
    - key: test-panel
      title: UIKit Bridge Test
      icon: https://example.com/icon.svg
      resource: main
      render: native
      resolver:
        function: resolver

  function:
    - key: resolver
      handler: resolvers.handler

resources:
  - key: main
    path: src/index.tsx

permissions:
  scopes:
    - read:jira-work
    - read:confluence-space.summary
