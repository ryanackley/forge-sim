app:
  id: ari:cloud:ecosystem::app/e2e-uikit-events
  runtime:
    name: nodejs22.x

modules:
  jira:issuePanel:
    - key: events-panel
      icon: https://example.com/icon.svg
      resource: main
      resolver:
        function: resolver
      render: native
      title: UIKit Events Test

  function:
    - key: resolver
      handler: resolvers.handler

resources:
  - key: main
    path: src/index.tsx

permissions:
  scopes:
    - read:jira-work
