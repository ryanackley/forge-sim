modules:
  jira:customFieldType:
    - key: priority-score
      name: Priority Score
      description: Weighted priority score for the issue
      type: number
      value:
        function: value-fn
      view:
        resource: view-resource
        render: native
      edit:
        resource: edit-resource
        render: native
      resolver:
        function: resolver

  function:
    - key: resolver
      handler: resolver.handler
    - key: value-fn
      handler: value.handler

resources:
  - key: view-resource
    path: src/view.tsx
  - key: edit-resource
    path: src/edit.tsx

app:
  runtime:
    name: nodejs22.x
  id: ari:cloud:ecosystem::app/custom-field-test
  name: Custom Field Test
