app:
  id: ari:cloud:ecosystem::app/manifest-entities-test
  runtime:
    name: nodejs22.x
  storage:
    entities:
      - name: task
        attributes:
          title:
            type: string
          status:
            type: string
          priority:
            type: integer
          projectId:
            type: string
          createdAt:
            type: string
        indexes:
          - name: by-project
            partition:
              - projectId
            range:
              - priority
          - name: by-status
            partition:
              - status
            range:
              - createdAt
      - name: comment
        attributes:
          body:
            type: string
          taskKey:
            type: string
          createdAt:
            type: string
        indexes:
          - name: by-task
            partition:
              - taskKey
            range:
              - createdAt

modules:
  webtrigger:
    - key: noop-hook
      function: noop
  function:
    - key: noop
      handler: index.handler

permissions:
  scopes:
    - storage:app
